name: APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: İmza anahtarını hazırla (ilk seferde oluşturur ve depoya kaydeder)
        run: |
          mkdir -p android
          if [ ! -f android/kargo.jks ]; then
            keytool -genkeypair -v -keystore android/kargo.jks -alias kargo -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass kargorota123 -keypass kargorota123 -dname "CN=Kargo Rota, O=Kargo Rota, C=TR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/kargo.jks
            git commit -m "APK imza anahtarı"
            git push
          fi
          keytool -list -v -keystore android/kargo.jks -storepass kargorota123 | grep -i "SHA256:" | head -1

      - name: Web uygulama dosyalarını oluştur (simge, manifest, sw) ve depoya kaydet
        run: |
          python3 - <<'PYEOF2'
          import zlib,struct,json
          def png(n,path):
              s=n/108.0
              polys=[([(54,32),(74,43),(74,65),(54,76),(34,65),(34,43)],(255,255,255)),
                     ([(54,32),(74,43),(54,54),(34,43)],(22,163,74)),
                     ([(54,54),(74,43),(74,65),(54,76)],(209,213,219))]
              polys=[([(x*s,y*s) for x,y in p],c) for p,c in polys]
              def inside(x,y,p):
                  r=False;j=len(p)-1
                  for i in range(len(p)):
                      xi,yi=p[i];xj,yj=p[j]
                      if (yi>y)!=(yj>y) and x<(xj-xi)*(y-yi)/(yj-yi)+xi:r=not r
                      j=i
                  return r
              rows=[]
              for y in range(n):
                  row=bytearray([0])
                  for x in range(n):
                      c=(17,24,39)
                      for p,col in polys:
                          if inside(x+.5,y+.5,p):c=col
                      row+=bytes(c)
                  rows.append(bytes(row))
              def ch(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              open(path,'wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',n,n,8,2,0,0,0))+ch(b'IDAT',zlib.compress(b''.join(rows),9))+ch(b'IEND',b''))
          png(192,'icon-192.png');png(512,'icon-512.png')
          json.dump({"id":"./","name":"Kargo Rota","short_name":"Kargo Rota","description":"Kargo dağıtım rotası","start_url":"./","scope":"./","display":"standalone","orientation":"portrait","background_color":"#111827","theme_color":"#111827","lang":"tr",
           "icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]},open('manifest.json','w'),ensure_ascii=False,indent=1)
          open('sw.js','w').write("""const C='kargo-v1';
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET'||new URL(r.url).origin!==location.origin)return;
           e.respondWith(fetch(r).then(res=>{const cp=res.clone();caches.open(C).then(c=>c.put(r,cp));return res}).catch(()=>caches.match(r).then(m=>m||caches.match('./'))))});
          """)
          print('web dosyaları hazır')
          PYEOF2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json sw.js icon-192.png icon-512.png
          if ! git diff --cached --quiet; then git commit -m "Uygulama simgesi ve manifest"; git pull --rebase; git push; fi

      - name: Android proje dosyalarını oluştur
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/"
          HOST="${{ github.repository_owner }}.github.io"
          mkdir -p twa/app/src/main/res/values twa/app/src/main/res/drawable twa/app/src/main/res/mipmap-anydpi-v26
          cd twa

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'KargoRota'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.kargorota.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.kargorota.app'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/android/kargo.jks')
                      storePassword 'kargorota123'
                      keyAlias 'kargo'
                      keyPassword 'kargorota123'
                      enableV1Signing true
                      enableV2Signing true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Kargo Rota" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:allowBackup="true">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements"/>
              <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                        android:exported="true" android:label="Kargo Rota"
                        android:theme="@android:style/Theme.Translucent.NoTitleBar">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="${SITE}"/>
                <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/primary"/>
                <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/primary"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <resources>
            <string name="asset_statements">[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://${HOST}\"}}]</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="primary">#111827</color></resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/primary"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M54,32 L74,43 L74,65 L54,76 L34,65 L34,43 Z"/>
            <path android:fillColor="#16A34A" android:pathData="M54,32 L74,43 L54,54 L34,43 Z"/>
            <path android:fillColor="#D1D5DB" android:pathData="M54,54 L74,43 L74,65 L54,76 Z"/>
          </vector>
          EOF

          echo "Uygulamanın açacağı adres: $SITE"

      - name: APK derle
        working-directory: twa
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı Releases bölümüne yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp twa/app/build/outputs/apk/release/app-release.apk KargoRota.apk
          gh release create "apk-${{ github.run_number }}" KargoRota.apk \
            --repo "${{ github.repository }}" \
            --title "Kargo Rota APK #${{ github.run_number }}" \
            --notes "Telefona indirip kurun. Sürüm (release) paketi, sabit imzalı."
