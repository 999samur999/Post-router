<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Kargo Rota</title>
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#1C2430;--ink2:#2B3646;--muted:#5B6675;--line:#DCE1E7;--green:#0E8A5F;--green-weak:#E3F3EC;--hivis:#F2B705;--danger:#C2412D;--danger-weak:#FBEAE6;--grey:#9AA4B1;
 --f:'Barlow',system-ui,sans-serif;--fc:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.pane{display:none;flex:1;position:relative;min-height:0;overflow:auto}.pane.on{display:flex;flex-direction:column}
.ic{width:22px;height:22px;flex:none}
/* başlık */
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 6px}
.hd h1{margin:0;font:700 26px/1.1 var(--fc);letter-spacing:.2px}
.count{font:600 15px var(--fc);color:var(--muted)}
h2.sec{font:700 17px var(--fc);margin:22px 16px 8px}
/* düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--ink);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.primary,.btn.k{background:var(--ink);color:#fff}
.btn.g{background:var(--green);color:#fff}
.btn.ghost,.btn.x,.btn.p{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger,.btn.r{background:var(--danger-weak);color:var(--danger)}
.btn.block,.btn.big{display:flex;width:100%}
.btn.grow{flex:1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* ekle ekranı */
#p-add{padding-bottom:24px}
.entry{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 16px 12px}
.area{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:0 16px 4px;color:var(--muted)}
.area input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:15px;color:var(--ink)}
#txt{display:block;width:100%;height:150px;resize:none;border:2px solid var(--ink);border-radius:16px;background:var(--surface);padding:14px 16px;font:500 19px/1.45 var(--f);color:var(--ink);box-shadow:0 1px 0 var(--line)}
#txt::placeholder{color:var(--grey)}
#txt:focus{outline:none;border-color:var(--green)}
.entry-actions{display:flex;gap:10px;align-items:center;margin-top:12px}
.mic{width:58px;height:58px;border-radius:50%;border:0;background:var(--hivis);color:var(--ink);display:grid;place-items:center;flex:none;cursor:pointer;box-shadow:0 2px 0 #c99600}
.mic .ic{width:26px;height:26px}
.mic.on{background:var(--ink);color:var(--hivis);box-shadow:0 0 0 0 rgba(242,183,5,.6);animation:ring 1.4s infinite}
@keyframes ring{to{box-shadow:0 0 0 14px rgba(242,183,5,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;box-shadow:0 0 0 4px var(--hivis)}}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 0;font-size:15px}
.switch-row small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(28,36,48,.3);transition:transform .15s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
.hint{margin:4px 16px 0;color:var(--muted);font-size:13.5px}
.editbar{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:#FFF6D6;border:1px solid var(--hivis);font-size:14px}
#banner{margin:0 16px}
#bGo{margin:16px 16px 0;width:auto}
.banner{background:#FFF6D6;border:1px solid var(--hivis);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;color:var(--ink)}
/* satırlar */
.rows{margin:0 16px;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.rows:empty{display:none}
.rw{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 12px;border-top:1px solid var(--line)}
.rw:first-child{border-top:0}
.dotc{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin:0 4px}
.dist{font-size:13px;color:var(--muted);margin-top:4px}
.no{min-width:32px;height:32px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font:700 15px var(--fc);color:#fff;background:var(--c);flex:none}
.rw .col{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad{color:var(--muted);font-size:14px}
.warn{color:#9A5B00;font-size:13px;margin-top:2px}
.dupw{color:#6D28D9;font-size:13px;font-weight:600;margin-top:2px}
.rw.dup .no,.rw.dup .dotc{box-shadow:0 0 0 3px #fff,0 0 0 5px #7C3AED}
.rw.dup{background:#F5F0FF}
.rw.done .nm,.rw.done .ad{color:#98A2AF;text-decoration:line-through}
.rw.done .no{background:#B7BFC9}
.rw[data-id]{cursor:pointer}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer;color:var(--ink)}
.ib.ok{background:var(--green-weak);border-color:transparent;color:var(--green)}
.empty{margin:24px 16px;color:var(--muted);text-align:center}
/* ayarlar */
.group{margin:8px 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.group h2{margin:0 0 6px;font:700 17px var(--fc)}
.group .btn.block{margin-top:10px}
.fld{display:block;font-size:14px;color:var(--muted)}
.keyrow{display:flex;gap:8px;margin-top:6px}
.keyrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;font-size:15px;background:var(--bg)}
/* harita */
#map{flex:1;min-height:300px}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;z-index:3}
.pill{height:46px;min-width:46px;padding:0 14px;border-radius:23px;border:0;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(28,36,48,.18);cursor:pointer}
.pill.icon{padding:0;justify-content:center}
.pill.on{background:var(--green);color:#fff}
.recenter{position:absolute;left:12px;bottom:36px;z-index:3;transition:bottom .2s}
.pill.go{background:var(--ink);color:#fff;flex:1;justify-content:center}
#more{position:absolute;top:56px;right:0;background:var(--surface);border-radius:14px;box-shadow:0 6px 24px rgba(28,36,48,.22);overflow:hidden;min-width:250px}
#more button{display:block;width:100%;text-align:left;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;font-size:15px;cursor:pointer}
#more button:first-child{border-top:0}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(28,36,48,.16);max-height:92%;display:flex;flex-direction:column;z-index:4}
.sheet.anim{transition:height .22s ease}
.sh-head{padding:8px 16px 10px;touch-action:none;cursor:grab;flex:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-body{padding:0 16px 14px;overflow:auto;flex:1;min-height:0}
.sheet.mini .sh-body{display:none}.sheet.mini .sh-head{padding-bottom:12px}
.sheet.peek{max-height:46%}
.sheet.full{height:82%}
.sh-hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.sh-title{font:700 18px var(--fc);margin:4px 0 8px}
.sh-body .rows{margin:0}
.stats{display:flex;gap:16px;font:600 14px var(--fc);color:var(--muted)}
.stats b{font-size:17px;color:var(--ink);margin-right:3px}
.nextl{margin-top:10px;font-size:13px;color:var(--muted)}
.nextn{font:700 20px/1.2 var(--fc)}
.lbldone{text-decoration:line-through}
.lbl{text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff,0 0 3px #fff;letter-spacing:.1px}
/* navigasyon paneli */
.navp{position:absolute;top:0;left:0;right:0;background:rgba(28,36,48,.86);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);color:#fff;padding:12px 14px 6px;display:none;z-index:5;border-radius:0 0 20px 20px;box-shadow:0 4px 18px rgba(28,36,48,.3);touch-action:none}
.navp.drag{transition:none}.navp.snap{transition:transform .2s ease}
.navp .ins{display:flex;gap:12px;align-items:center}
.navp .mi{width:54px;height:54px;flex:none;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.navp .mi svg{width:34px;height:34px}
.navp .it{min-width:0;flex:1}
.navp .big{font:700 30px/1 var(--fc)}.navp .txt{font:600 17px/1.25 var(--fc);margin-top:3px}
.navp .sub{font-size:13.5px;margin-top:10px;color:#C9D1DB}
.navp .sub .l1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navp .acts{display:flex;gap:8px;margin-top:10px}
.navp .acts .btn{min-height:50px;white-space:nowrap;padding:0 14px}
.navp .acts .btn.g{flex:1}
.navp .acts .btn.x{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.navp .tools{display:flex;gap:8px;margin-top:8px}
.navp .tb{flex:1;min-height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#DCE3EA;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.navp .tb.snd{flex:0 0 48px}.navp .tb svg{width:20px;height:20px}
.navp .tb.stop{color:#FFB4A6;border-color:rgba(255,180,166,.35)}
.navp .grab{background:rgba(255,255,255,.3);margin:10px auto 2px}
.navp.arr .mi{background:var(--green)}
.navp .tag{display:inline-block;font:700 13px var(--fc);background:var(--green);color:#fff;border-radius:6px;padding:2px 7px;margin-bottom:6px}
.strip{display:flex;align-items:center;gap:10px}
.strip .mi{width:40px;height:40px;border-radius:11px}.strip .mi svg{width:26px;height:26px}
.strip .sl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.strip .sbig{font:700 22px/1 var(--fc);flex:none}.strip .stxt{font:600 15px var(--fc);overflow:hidden;text-overflow:ellipsis;color:#DCE3EA}
/* alt menü */
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 13px var(--f);cursor:pointer}
nav button.on{color:var(--ink);border-top-color:var(--hivis)}
/* işlem menüsü */
#act{position:fixed;inset:0;background:rgba(28,36,48,.45);z-index:25;display:none;align-items:flex-end}
#act.on{display:flex}
#act .panel{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));max-height:85%;overflow:auto}
#act .ah{padding:12px 18px 10px;border-bottom:1px solid var(--line)}
#act .ah .nm{white-space:normal}
#act button.ai{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:0;background:none;font-size:16px;text-align:left;cursor:pointer}
#act button.ai.danger{color:var(--danger)}
#act .ar{display:flex;gap:8px;padding:8px 18px}
#act .ar .btn{flex:1}
/* paylaşım sayfası (eski sınıflar) */
.n{font-weight:700;font-size:16px}.a{font-size:13.5px;color:var(--muted);margin:2px 0}.lab{font:700 15px var(--fc);margin-top:14px}
.card{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}.card .col{flex:1;min-width:0}.card .bt{display:flex;flex-wrap:wrap;gap:6px;max-width:170px}
.card .bt .btn{min-height:38px;padding:0 10px;font-size:13px}
#ov{position:fixed;inset:0;background:var(--surface);z-index:20;overflow:auto;display:none;padding:16px 16px 40px}
#ov.on{display:block}#ov .card{cursor:pointer}.seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg .btn{min-height:40px;text-decoration:none}
.done .n{text-decoration:line-through;color:var(--muted)}
#toast{position:fixed;left:16px;right:16px;bottom:88px;z-index:30;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;display:none;font-size:14.5px;box-shadow:0 6px 20px rgba(28,36,48,.3)}
</style></head><body><div id="app">

<section id="p-add" class="pane on">
 <header class="hd"><h1>Adres ekle</h1><span class="count" id="cnt">0 / 300</span></header>
 <label class="area"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg><input type="text" id="area" placeholder="Çalışma bölgesi: mahalle, ilçe, il" aria-label="Çalışma bölgesi"></label>
 <div class="entry">
  <div id="editbar" class="editbar" style="display:none"></div>
  <textarea id="txt" placeholder="Ad soyad, sokak, bina no&#10;Örn: Pınar Karakule 845 Sokak 45" aria-label="Adres"></textarea>
  <div class="entry-actions">
   <button class="mic" id="bMic" aria-label="Sesle ekle"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <button class="btn primary grow" id="bAdd">Ekle</button>
   <button class="btn ghost" id="bClr">Temizle</button>
  </div>
  <label class="switch-row"><span>Söyleyince otomatik ekle</span><input type="checkbox" id="auto" class="sw"></label>
 </div>
 <p class="hint">Sıra: ad soyad, sokak, bina no. İsterseniz daire, kat veya mahalle ekleyin. Sesli komutlar: “teslim edildi”, “edilemedi”.</p>
 <div id="banner"></div>
 <button class="btn primary" id="bGo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg>Rotayı oluştur</button>
 <h2 class="sec">Son eklenenler</h2>
 <div id="recent" class="rows"></div>
</section>

<section id="p-map" class="pane">
 <div id="map"></div>
 <div class="top">
  <button class="pill on" id="bFollow" aria-label="Konum takibi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Takip</span></button>
  <button class="pill go" id="bNavStart"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg>Rotayı başlat</button>
  <button class="pill icon" id="bShare" aria-label="Rotayı paylaş"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
  <div style="position:relative"><button class="pill icon" id="bMore" aria-label="Diğer"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
   <div id="more" style="display:none">
    <button id="bStart">Başlangıç noktasını haritadan seç</button>
    <button id="bMe">Başlangıç: konumum</button>
    <button id="bRoute">Rotayı yeniden hesapla</button>
    <button id="bDraw">Yolu yeniden çiz</button>
    <button id="bNav">Sıradakini Google Haritalar'da aç</button>
   </div></div>
 </div>
 <div class="navp" id="navp"></div>
 <button class="pill recenter" id="bRecenter" style="display:none" aria-label="Konumuma dön"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Konumuma dön</button>
 <div class="sheet peek" id="sheet"><div class="sh-head" id="shHead"></div><div class="sh-body" id="shBody"></div></div>
</section>

<section id="p-list" class="pane">
 <header class="hd"><h1>Liste</h1><span class="count" id="lcnt"></span></header>
 <div id="list" class="rows"></div>
 <p class="empty" id="lempty">Henüz adres yok. Ekle sekmesinden başlayın.</p>
</section>

<section id="p-set" class="pane">
 <header class="hd"><h1>Ayarlar</h1></header>
 <div class="group"><h2>Google Haritalar</h2>
  <label class="fld" for="key">API anahtarı</label>
  <div class="keyrow"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…"><button class="btn ghost" id="bKeyShow">Göster</button></div>
  <div class="row"><button class="btn primary grow" id="bKey">Kaydet</button><button class="btn ghost grow" id="bTest">Bağlantıyı sına</button></div>
  <button class="btn ghost block" id="bRetry">Konumu bulunamayanları yeniden ara</button>
 </div>
 <div class="group"><h2>Teslimat</h2>
  <label class="switch-row" style="padding-top:4px"><span>Otomatik teslim<small>Adrese 30 m yaklaşıp 15 sn kalınca teslim edildi sayılır</small></span><input type="checkbox" id="bMode" class="sw"></label>
  <label class="switch-row"><span>Sesli yönlendirme</span><input type="checkbox" id="voiceSw" class="sw"></label>
 </div>
 <div class="group" id="gInstall" style="display:none"><h2>Uygulama</h2><button class="btn primary block" id="bInstall">Uygulamayı telefona yükle</button></div>
 <div class="group"><h2>Veriler</h2>
  <button class="btn ghost block" id="bTrail">Gidilen yol izini sıfırla</button>
  <button class="btn danger block" id="bClear">Tüm adresleri ve rotayı sil</button>
 </div>
</section>

<nav>
 <button data-t="add" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ekle</button>

<script>
const IC={"check": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 5 5L20 7\"/></svg>", "undo": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 14 4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>", "more": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"12\" r=\"1.3\"/><circle cx=\"12\" cy=\"12\" r=\"1.3\"/><circle cx=\"19\" cy=\"12\" r=\"1.3\"/></svg>", "edit": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16v4Z\"/></svg>", "x": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg>", "pin": "<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>"};
const MAX=300,ARRIVE_M=30,DWELL_MS=15000,LS='kargo-sesli-v1';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TRM={ç:'C',ğ:'G',ı:'I',ö:'O',ş:'S',ü:'U',Ç:'C',Ğ:'G',İ:'I',Ö:'O',Ş:'S',Ü:'U'};
function norm(s){return s.replace(/[çğıöşüÇĞİÖŞÜ]/g,c=>TRM[c]).toUpperCase().replace(/\s+/g,' ').trim()}

/* ---------- adres ayrıştırma: ad → sokak → apartman no ---------- */
const SK='SOKAGI|SOKAK|SOK|SK|CADDESI|CADDE|CAD|CD|BULVARI|BULVAR|BLV';
const SKre=new RegExp('^('+SK+')$');
function parseEntry(text){
 const raw=text.trim();
 let segs=raw.split(/[,;\n]+/).map(norm).filter(Boolean).map(s=>s.replace(/\bNUMARASI\b|\bNUMARA\b/g,'NO'));
 let daire=null,kat=null,mahalle=null;
 segs=segs.map(s=>{let m=s.match(/\bDAIRE\s*[:.]?\s*(\d+)/);if(m){daire=m[1];s=s.replace(m[0],' ')}
  m=s.match(/\bKAT\s*[:.]?\s*(\d+)/);if(m){kat=m[1];s=s.replace(m[0],' ')}
  m=s.match(/\b([A-Z0-9]+)\s+(?:MAHALLESI|MAHALLE|MAH|MH)\b\.?/);if(m){mahalle=m[1];s=s.replace(m[0],' ')}
  return s.replace(/\s+/g,' ').trim()}).filter(Boolean);
 let name=null,street=null,no=null;
 const hasKey=s=>new RegExp('\\b('+SK+')\\b').test(s);
 if(segs.length>=2){
  let rest=segs;
  if(!/\d/.test(segs[0])&&!hasKey(segs[0])){name=segs[0];rest=segs.slice(1)}
  street=rest[0];
  const nm=street.match(/\bNO\s*[:.]?\s*(\d+[A-Z]?)/);if(nm){no=nm[1];street=street.replace(nm[0],' ').replace(/\s+/g,' ').trim()}
  if(!no){const m=rest.slice(1).join(' ').match(/(\d+[A-Z]?)/);if(m)no=m[1]}
  if(/^\d+$/.test(street))street+=' SOKAK';
 }else if(segs.length===1){
  const tk=segs[0].split(' '),isN=t=>/^\d+[A-Z]?$/.test(t);
  const k=tk.findIndex(t=>SKre.test(t)),nums=tk.map((t,i)=>isN(t)?i:-1).filter(i=>i>=0);
  let after=[];
  if(k>=1){street=tk[k-1]+' '+tk[k];name=tk.slice(0,k-1).join(' ')||null;after=tk.slice(k+1)}
  else if(nums.length){const j=nums[0];name=tk.slice(0,j).join(' ')||null;street=tk[j]+' SOKAK';after=tk.slice(j+1)}
  else{name=tk.join(' ')}
  const ai=after.findIndex(isN);if(ai>=0)no=after[ai];
 }
 return {name,street,no,daire,kat,mahalle,raw};
}

/* ---------- durum ---------- */
let S={items:[],mode:'manual',start:null,route:[],key:'',area:'',auto:true,dirty:false,trail:[],dist:0,follow:true}, tab='add', sel=null, pos=null, pickStart=false;
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
S.trail=S.trail||[];S.dist=S.dist||0;if(S.follow===undefined)S.follow=true;
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3800)}
// teslim edilen = siyah, henüz edilmeyen = yeşil, edilemedi = gri
const colorOf=i=>i.status==='delivered'?'#000000':i.status==='failed'?'#9ca3af':'#16a34a';
const labelColor=i=>i.status==='pending'&&DUP.has(i.id)?DUPC:i.status==='delivered'?'#8A94A3':i.status==='failed'?'#6B7480':'#06573A';
const DUPC='#7C3AED';let DUP=new Map();
const nameKey=n=>n?norm(n).replace(/[^A-Z]/g,''):'';
function calcDup(){const g=new Map();S.items.forEach(i=>{const k=nameKey(i.name);if(k.length<4)return;if(!g.has(k))g.set(k,[]);g.get(k).push(i.id)});
 DUP=new Map();g.forEach(ids=>{if(ids.length>1)ids.forEach(id=>DUP.set(id,ids))})}
const dupOf=i=>DUP.get(i.id);
function dupText(i){const ids=dupOf(i);if(!ids)return '';const nums=ids.map(id=>orderOf(id)).filter(Boolean);
 return 'Aynı kişi '+ids.length+' kez girildi'+(nums.length>1?' ('+nums.join('. ve ')+'. sıra)':'')}
const find=id=>S.items.find(i=>i.id===id);
const orderOf=id=>{const k=S.route.indexOf(id);return k>=0?String(k+1):''};
const nextStop=()=>S.route.map(find).find(i=>i&&i.status==='pending'&&i.inRoute&&i.lat!=null);
const addrOf=i=>[i.street||i.raw,i.no?'No:'+i.no:'',i.mahalle?i.mahalle+' Mah':'',i.kat?'Kat:'+i.kat:'',i.daire?'D:'+i.daire:''].filter(Boolean).join(' ');
const ask=m=>confirm(m);
function hav(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function optimize(start,pts){const rem=[...pts],arr=[start];
 while(rem.length){const c=arr[arr.length-1];let bi=0,bd=1e18;rem.forEach((p,i)=>{const d=hav(c,p);if(d<bd){bd=d;bi=i}});arr.push(rem.splice(bi,1)[0])}
 const n=arr.length,d=(a,b)=>hav(arr[a],arr[b]);let imp=true,pass=0;
 while(imp&&pass++<60){imp=false;for(let i=1;i<n-1;i++)for(let j=i+1;j<n;j++){const af=j+1<n;
  const dl=d(i-1,j)+(af?d(i,j+1):0)-d(i-1,i)-(af?d(j,j+1):0);
  if(dl<-1){const seg=arr.slice(i,j+1).reverse();arr.splice(i,j-i+1,...seg);imp=true}}}
 return arr.slice(1).map(p=>p.id)}
function insertCheapest(id){const it=find(id),origin=pos||S.start;
 const seq=S.route.map(find).filter(x=>x&&x.id!==id&&x.status==='pending'&&x.inRoute&&x.lat!=null);
 if(!seq.length){S.route.push(id);return}
 let best=0,bd=1e18;
 for(let j=0;j<=seq.length;j++){const prev=j===0?origin:seq[j-1],next=seq[j];
  const d=(prev?hav(prev,it):0)+(next?hav(it,next):0)-(prev&&next?hav(prev,next):0);if(d<bd){bd=d;best=j}}
 const idx=best===0?S.route.indexOf(seq[0].id):S.route.indexOf(seq[best-1].id)+1;
 S.route.splice(idx,0,id)}

/* ---------- Google Maps ---------- */
let mapsP=null,map=null,markers=[],polys=[],meMarker=null,startMarker=null,trailLine=null,accCircle=null,heading=null,firstFix=true,trailDirty=0;
window.gm_authFailure=()=>toast('Google API anahtarı geçersiz veya API etkin değil');
function ensureMaps(){if(window.google&&google.maps&&google.maps.Map)return Promise.resolve();
 if(!S.key){toast('Önce Liste sekmesinde Google API anahtarını girin');return Promise.reject()}
 if(mapsP)return mapsP;
 mapsP=new Promise((res,rej)=>{const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(S.key)+'&language=tr';
  s.onload=res;s.onerror=()=>{mapsP=null;toast('Google Haritalar yüklenemedi (internet?)');rej()};document.head.append(s)});
 return mapsP}
let gq=Promise.resolve(),gDenied=false;
const queryOf=i=>i.street?[i.street,i.no?'No:'+i.no:'',i.mahalle?i.mahalle+' Mah':'',i.area||''].filter(Boolean).join(' '):[i.raw,i.area||''].join(' ');
const fixStreet=s=>s?s.replace(/^(\d+)\s*(SOKAK|SOKAGI|SK|SOK)\b/i,'$1. Sokak'):s;
function gcall(q){const o=pos||S.start;let u='https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q)+'&components=country:TR&language=tr&region=tr&key='+encodeURIComponent(S.key);
 if(o){const d=0.2;u+='&bounds='+(o.lat-d)+','+(o.lng-d)+'|'+(o.lat+d)+','+(o.lng+d)}
 return fetch(u).then(r=>r.json())}
function geocodeText(it){return gq=gq.then(async()=>{
 if(!S.key)return {geo:'pending',geoErr:'API anahtarı yok'};
 if(gDenied)return {geo:'pending',geoErr:gDenied};
 const st=fixStreet(it.street),mh=it.mahalle?it.mahalle+' Mahallesi':'',ar=it.area||'';
 const tries=it.street?[[st,it.no?'No:'+it.no:'',mh,ar],[st,it.no||'',mh,ar],[st,mh,ar]].map(x=>x.filter(Boolean).join(' ')):[[it.raw,ar].join(' ')];
 let best=null;
 for(let k=0;k<tries.length;k++){await sleep(150);
  let j;for(let n=0;n<3;n++){try{j=await gcall(tries[k])}catch(e){return {geo:'pending',geoErr:'İnternet/Google erişimi yok'}}
   if(j.status==='OVER_QUERY_LIMIT'){await sleep(1500);continue}break}
  if(j.status==='REQUEST_DENIED'||j.status==='INVALID_REQUEST'){gDenied='Google reddetti: '+(j.error_message||j.status);toast(gDenied);return {geo:'none',geoErr:gDenied}}
  if(j.status!=='OK'||!j.results.length)continue;
  const g=j.results[0],l=g.geometry.location,ty=g.types||[];
  const street=ty.some(x=>['street_address','premise','subpremise'].includes(x))||['ROOFTOP','RANGE_INTERPOLATED'].includes(g.geometry.location_type);
  const exact=k===0&&it.no&&!g.partial_match&&street;
  const r={lat:l.lat,lng:l.lng,geo:exact?'ok':'approx',geoErr:'',found:g.formatted_address};
  if(exact)return r;
  if(!best||(k<2&&best.k>=2)){best={...r,k}}
 }
 if(best){delete best.k;return best}
 return {geo:'none',geoErr:'Google adresi bulamadı'}}).catch(()=>({geo:'pending'}))}
async function geoItem(it){const g=await geocodeText(it);
 if(g.geo==='pending'&&!g.geoErr)return;upd(it.id,{geo:g.geo,lat:g.lat,lng:g.lng,geoErr:g.geoErr,found:g.found||''})}
function upd(id,p){const i=find(id);if(!i)return;Object.assign(i,p);save();renderAll()}

/* ---------- ekleme (yazı / ses) ---------- */
function addEntry(text){
 const v=text.trim();if(v.length<4)return toast('Adresi yazın veya söyleyin');
 if(S.items.length>=MAX)return toast(MAX+' adres sınırına ulaşıldı');
 const p=parseEntry(v),key='M|'+norm(v);
 if(S.items.some(i=>i.key===key))return toast('Bu adres zaten eklenmiş');
 const hasRoute=S.route.length>0;
 const it={...p,id:Date.now()+''+Math.random().toString(36).slice(2,6),key,area:S.area,geo:'pending',status:'pending',inRoute:!hasRoute,isNew:hasRoute};
 const nk=nameKey(p.name),twin=nk.length>=4&&S.items.find(i=>nameKey(i.name)===nk);
 S.items.push(it);save();renderAll();geoItem(it);
 if(twin){if(navigator.vibrate)navigator.vibrate([80,60,80]);toast('Dikkat: '+(p.name||'')+' zaten listede'+(orderOf(twin.id)?' ('+orderOf(twin.id)+'. sırada)':'')+'. İkisi de mor ile işaretlendi.');return}
 toast('Eklendi: '+(p.name||v.slice(0,30))+(S.area||p.mahalle?'':' (çalışma bölgesi boş, konum yanlış olabilir)'))}
let editId=null;
function endEdit(){editId=null;$('#bAdd').textContent='Ekle';$('#editbar').style.display='none'}
function startEdit(id){const it=find(id);if(!it)return;editId=id;$('#txt').value=it.raw||addrOf(it);
 $('#bAdd').textContent='Kaydet';const b=$('#editbar');b.style.display='block';b.textContent=(it.name||it.street||'Adres')+' düzenleniyor. Düzeltip Kaydet\'e basın, vazgeçmek için Temizle.';
 document.querySelector('nav button[data-t="add"]').click();$('#txt').focus()}
function saveEdit(){const v=$('#txt').value.trim();if(v.length<4)return toast('Adresi yazın');const it=find(editId);if(!it){endEdit();return}
 const oldQ=queryOf(it),p=parseEntry(v);
 Object.assign(it,{name:p.name,street:p.street,no:p.no,daire:p.daire,kat:p.kat,mahalle:p.mahalle,raw:v,key:'M|'+norm(v)});
 const changed=queryOf(it)!==oldQ;const id=it.id;
 if(changed){Object.assign(it,{geo:'pending',lat:null,lng:null,geoErr:'',found:''});if(S.route.includes(id))S.dirty=true}
 save();endEdit();$('#txt').value='';renderAll();if(changed)geoItem(it);toast(changed?'Kaydedildi, yeni konum aranıyor':'Kaydedildi')}
$('#bAdd').onclick=()=>{if(editId)return saveEdit();addEntry($('#txt').value);$('#txt').value=''};
$('#bClr').onclick=()=>{$('#txt').value='';endEdit()};
$('#area').value=S.area||'';$('#area').onchange=()=>{S.area=$('#area').value.trim();save()};
$('#auto').checked=S.auto!==false;$('#auto').onchange=()=>{S.auto=$('#auto').checked;save()};

/* ---------- sesli giriş ---------- */
let rec=null,listening=false,pinTarget=null;
function setMic(){const b=$('#bMic');b.classList.toggle('on',listening);b.setAttribute('aria-pressed',listening?'true':'false');b.setAttribute('aria-label',listening?'Dinlemeyi durdur':'Sesle ekle')}
function markNext(st){const n=nextStop();if(!n)return toast('Sıradaki durak yok (önce rota oluşturun)');upd(n.id,{status:st});toast((st==='delivered'?'Teslim edildi: ':'Edilemedi: ')+(n.name||''))}
function handleSpeech(s){const n=norm(s);
 if(/^(TESLIM EDILDI|TESLIM ETTIM|TAMAM)$/.test(n))return markNext('delivered');
 if(/^(EDILEMEDI|TESLIM EDILEMEDI)$/.test(n))return markNext('failed');
 if($('#auto').checked&&!editId)addEntry(s);else $('#txt').value=(($('#txt').value+' ')+s).trim()}
function startRec(SR){rec=new SR();rec.lang='tr-TR';rec.interimResults=false;rec.maxAlternatives=1;
 rec.onresult=e=>{handleSpeech(e.results[e.results.length-1][0].transcript)};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;toast('Mikrofon izni verin')}};
 rec.onend=()=>{if(listening)setTimeout(()=>{try{startRec(SR)}catch(x){listening=false}setMic()},250);else setMic()};
 try{rec.start()}catch(e){}}
$('#bMic').onclick=async()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('Bu tarayıcı sesli girişi desteklemiyor, Chrome kullanın');
 if(listening){listening=false;try{rec.stop()}catch(e){}setMic();return}
 listening=true;setMic();try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}startRec(SR)};

/* ---------- konum + otomatik teslim ---------- */
let dwell={id:null,t:0};
function meIcon(){const moving=heading!=null&&!isNaN(heading);
 return moving?{path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW,scale:6,rotation:heading,fillColor:'#2563eb',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
  :{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#2563eb',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}}
function onPos(p){const c=p.coords;pos={lat:c.latitude,lng:c.longitude};
 heading=(c.speed!=null&&c.speed>0.7&&c.heading!=null&&!isNaN(c.heading))?c.heading:null;
 const last=S.trail[S.trail.length-1];
 if(c.accuracy<=40){const lp=last&&{lat:last[0],lng:last[1]},d=lp?hav(lp,pos):1e9;
  if(d>=8){if(lp&&d<500)S.dist+=d;S.trail.push([+pos.lat.toFixed(6),+pos.lng.toFixed(6)]);if(S.trail.length>5000)S.trail.splice(0,S.trail.length-5000);
   if(trailLine)trailLine.getPath().push(new google.maps.LatLng(pos.lat,pos.lng));if(++trailDirty>=10){trailDirty=0;save()}}}
 if(map&&window.google){if(meMarker){meMarker.setPosition(pos);meMarker.setIcon(meIcon())}
  if(accCircle){accCircle.setCenter(pos);accCircle.setRadius(Math.min(c.accuracy||0,200))}
  if(S.follow){if(firstFix){map.setZoom(17);firstFix=false}map.panTo(pos)}}
 renderDist();navTick()}
function renderDist(){const e=$('#dist');if(e)e.textContent='Gidilen yol: '+(S.dist/1000).toFixed(1)+' km'}
if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{onPos(p);
 if(S.mode!=='auto')return;const n=nextStop();if(!n)return;
 if(hav(pos,n)<ARRIVE_M){if(dwell.id!==n.id)dwell={id:n.id,t:Date.now()};
  else if(Date.now()-dwell.t>DWELL_MS){upd(n.id,{status:'delivered'});if(navigator.vibrate)navigator.vibrate([100,80,100]);dwell={id:null,t:0}}}
 else dwell={id:null,t:0}},e=>{if(e.code===1)toast('Konum izni verilmedi: canlı takip çalışmaz')},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});

/* ---------- harita ---------- */
async function initMap(){await ensureMaps();
 if(!map){map=new google.maps.Map($('#map'),{center:pos||{lat:36.8969,lng:30.7133},zoom:13,streetViewControl:false,mapTypeControl:false,fullscreenControl:false,cameraControl:false,clickableIcons:false,styles:[{featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'transit',elementType:'labels.icon',stylers:[{visibility:'off'}]}]});
  map.addListener('click',e=>{if(pinTarget){upd(pinTarget,{lat:e.latLng.lat(),lng:e.latLng.lng(),geo:'ok',geoErr:''});pinTarget=null;toast('Konum kaydedildi')}else if(pickStart){S.start={lat:e.latLng.lat(),lng:e.latLng.lng()};pickStart=false;save();renderMap()}else{sel=null;renderSheet()}});
  trailLine=new google.maps.Polyline({map,path:S.trail.map(x=>({lat:x[0],lng:x[1]})),strokeColor:'#2563eb',strokeOpacity:.8,strokeWeight:5,zIndex:3});
  accCircle=new google.maps.Circle({map,center:pos||{lat:0,lng:0},radius:0,strokeColor:'#2563eb',strokeOpacity:.3,strokeWeight:1,fillColor:'#2563eb',fillOpacity:.1,clickable:false});
  meMarker=new google.maps.Marker({map,position:pos||undefined,icon:meIcon(),zIndex:999});
  map.addListener('idle',declutter);map.addListener('zoom_changed',()=>setTimeout(declutter,50));
  map.addListener('dragstart',()=>{if(S.follow){S.follow=false;save();renderFollow()}});
  if(pos&&S.follow){map.setZoom(17);map.panTo(pos);firstFix=false}}
 google.maps.event.trigger(map,'resize');renderMap()}

async function legPath(o,d,mid){

  const r=await Route.computeRoutes({origin:{lat:o.lat,lng:o.lng},destination:{lat:d.lat,lng:d.lng},
   intermediates:mid.map(p=>({lat:p.lat,lng:p.lng})),travelMode:'DRIVING',fields:['path']});
  if(r.routes&&r.routes[0]&&r.routes[0].path)return r.routes[0].path.map(q=>({lat:typeof q.lat==='function'?q.lat():q.lat,lng:typeof q.lng==='function'?q.lng():q.lng}));
 }catch(e){}
 try{if(google.maps.DirectionsService){const r=await new Promise(res=>new google.maps.DirectionsService().route({origin:o,destination:d,
   waypoints:mid.map(p=>({location:{lat:p.lat,lng:p.lng},stopover:true})),travelMode:'DRIVING'},(rs,st)=>res({rs,st})));
  if(r.st==='OK')return r.rs.routes[0].overview_path.map(q=>({lat:q.lat(),lng:q.lng()}))}}catch(e){}

 if(arr.length<2)return;let fail=false;
 for(let a=0;a<arr.length-1;a+=23){const b=Math.min(a+23,arr.length-1);
  const path=await legPath(arr[a],arr[b],arr.slice(a+1,b));
